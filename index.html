<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мегаев Кирилл Андреевич — Проектирование инженерных систем</title>
    <meta name="description" content="Сложные инженерные задачи">

    <!-- Open Graph (превью в мессенджерах и соцсетях) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Мегаев К.А.">
    <meta property="og:title" content="Мегаев К.А.">
    <meta property="og:description" content="Сложные инженерные задачи">
    <meta property="og:image" content="https://kamegaev.github.io/testvisitka/og-image.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="853">
    <meta property="og:image:height" content="1280">
    <meta property="og:image:alt" content="Мегаев Кирилл Андреевич">
    <meta property="og:url" content="https://kamegaev.github.io/testvisitka/">
    <meta property="og:locale" content="ru_RU">

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Мегаев К.А.">
    <meta name="twitter:description" content="Сложные инженерные задачи">
    <meta name="twitter:image" content="https://kamegaev.github.io/testvisitka/og-image.jpg">

    <link rel="stylesheet" href="styles.css">

    <!-- Тема применяется до отрисовки, чтобы не было мигания -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem("theme");
                var theme = saved
                    || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
                document.documentElement.setAttribute("data-theme", theme);
            } catch (e) {
                document.documentElement.setAttribute("data-theme", "light");
            }
        })();
    </script>
</head>
<body>
    <!-- Фоновая графика: трубопроводы и воздуховоды -->
    <div class="background" aria-hidden="true">
        <svg class="bg-svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="pipeGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#8a8f96"/>
                    <stop offset="0.5" stop-color="#c7ccd2"/>
                    <stop offset="1" stop-color="#767b82"/>
                </linearGradient>
                <linearGradient id="pipeGradV" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0" stop-color="#8a8f96"/>
                    <stop offset="0.5" stop-color="#c7ccd2"/>
                    <stop offset="1" stop-color="#767b82"/>
                </linearGradient>
                <linearGradient id="ductGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#9aa0a7"/>
                    <stop offset="1" stop-color="#7c8188"/>
                </linearGradient>
            </defs>

            <!-- Воздуховоды (прямоугольные каналы) -->
            <g class="ducts" opacity="0.7">
                <!-- Горизонтальный воздуховод сверху -->
                <rect x="-40" y="90" width="1520" height="70" fill="url(#ductGrad)"/>
                <line x1="-40" y1="112" x2="1480" y2="112" stroke="#5f646b" stroke-width="1"/>
                <line x1="-40" y1="138" x2="1480" y2="138" stroke="#5f646b" stroke-width="1"/>
                <!-- Фланцы воздуховода -->
                <rect x="300" y="82" width="12" height="86" fill="#6b7077"/>
                <rect x="640" y="82" width="12" height="86" fill="#6b7077"/>
                <rect x="980" y="82" width="12" height="86" fill="#6b7077"/>

                <!-- Отвод воздуховода вниз -->
                <path d="M 1180 90 L 1250 90 L 1250 700 L 1180 700 Z" fill="url(#ductGrad)"/>
                <line x1="1215" y1="160" x2="1215" y2="700" stroke="#5f646b" stroke-width="1"/>
                <rect x="1174" y="300" width="82" height="12" fill="#6b7077"/>
                <rect x="1174" y="520" width="82" height="12" fill="#6b7077"/>
            </g>

            <!-- Трубопроводы (круглые трубы) -->
            <g class="pipes" opacity="0.75">
                <!-- Нижняя магистраль -->
                <rect x="-40" y="760" width="1520" height="46" fill="url(#pipeGrad)" rx="4"/>
                <ellipse cx="220" cy="783" rx="8" ry="30" fill="#6b7077"/>
                <ellipse cx="560" cy="783" rx="8" ry="30" fill="#6b7077"/>
                <ellipse cx="900" cy="783" rx="8" ry="30" fill="#6b7077"/>

                <!-- Вертикальный стояк слева с коленом -->
                <path d="M 150 300 L 196 300 L 196 760 L 150 760 Z" fill="url(#pipeGradV)"/>
                <path d="M 150 300 Q 150 254 196 254 L 360 254 L 360 300 L 196 300 Z" fill="url(#pipeGrad)"/>
                <rect x="142" y="430" width="62" height="10" fill="#6b7077"/>
                <rect x="142" y="600" width="62" height="10" fill="#6b7077"/>

                <!-- Верхняя тонкая труба -->
                <rect x="380" y="360" width="720" height="26" fill="url(#pipeGrad)" rx="4"/>
                <ellipse cx="500" cy="373" rx="6" ry="18" fill="#6b7077"/>
                <ellipse cx="760" cy="373" rx="6" ry="18" fill="#6b7077"/>
                <ellipse cx="1020" cy="373" rx="6" ry="18" fill="#6b7077"/>

                <!-- Колено вверх справа -->
                <path d="M 1074 360 L 1100 360 L 1100 210 Q 1100 184 1074 184 L 1074 210 Q 1074 200 1084 200 L 1084 360 Z" fill="url(#pipeGrad)"/>
            </g>
        </svg>
        <div class="bg-overlay"></div>
    </div>

    <button id="themeToggle" class="theme-toggle" type="button"
            aria-label="Переключить тему" title="Переключить тему">
        <!-- Луна (показывается в светлой теме) -->
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
        </svg>
        <!-- Солнце (показывается в тёмной теме) -->
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
    </button>

    <main class="card">
        <h1 class="name">Мегаев Кирилл Андреевич</h1>
        <p class="subtitle">Проектирование инженерных систем</p>
    </main>

    <script>
        (function () {
            var root = document.documentElement;
            var btn = document.getElementById("themeToggle");
            btn.addEventListener("click", function () {
                var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
                root.setAttribute("data-theme", next);
                try { localStorage.setItem("theme", next); } catch (e) {}
            });
        })();
    </script>
</body>
</html>
